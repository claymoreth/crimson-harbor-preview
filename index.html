<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crimson Harbor — Port Valen</title>
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0a18; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { width: min(100vw, 177.78vh); height: min(100vh, 56.25vw); display: block; touch-action: none; background: #0c0a18; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720" aria-label="Crimson Harbor: an open-world crime game in Port Valen. Drive, fight the Harbor Kings, and lose the police."></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
